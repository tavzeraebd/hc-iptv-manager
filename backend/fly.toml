# fly.toml — portal do IPTV Manager
# Uso:
#   cd IPTV_Manager/backend
#   fly launch --no-deploy --copy-config --name <seu-nome-unico>   (ou edite `app` abaixo)
#   fly secrets set SUPABASE_URL=... SUPABASE_SECRET_KEY=... PORTAL_ADMIN_TOKEN=...
#   fly deploy
#
# Estado fica no Supabase — sem volume. `auto_stop_machines = "off"` +
# `min_machines_running = 1` = nunca dorme (o Player faz heartbeat a cada 20s).

app = "CHANGE-ME-iptv-portal"
primary_region = "gru"   # São Paulo

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

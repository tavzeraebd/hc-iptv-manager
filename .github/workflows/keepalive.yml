name: keep-alive

# Pinga o /healthz do portal pra segurar o serviço free do Render acordado
# (ele dorme após ~15 min sem tráfego). Cron do GitHub Actions costuma atrasar
# alguns minutos em horário de pico — por isso rodamos a cada 5 min (mínimo do
# GitHub), pra ter folga dentro da janela de 15 min mesmo com atraso. Pra 100%
# sem dormir, some a isto um uptime externo (UptimeRobot free) ou o plano pago.
# O Player também tem retry no cold start, então um atraso eventual é invisível.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: curl /healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://hc-iptv-portal.onrender.com/healthz) && break
            sleep 15
          done
          echo "healthz -> HTTP $code"
          test "$code" = "200"
